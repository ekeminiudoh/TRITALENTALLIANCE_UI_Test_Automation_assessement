name: UI Tests (SauceDemo)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:          # Adds a "Run workflow" button in the Actions tab

# Cancel an older run of the same branch when a newer commit arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read              # Least privilege: the job only needs to read the code

env:
  CI: true                    # Activates the config's CI behaviour: retries=2, forbidOnly

jobs:
  ui-tests:
    name: Playwright UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm            # Caches ~/.npm keyed on package-lock.json

      - name: Install dependencies
        run: npm ci             # Exact versions from package-lock.json

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium   # --with-deps adds OS libraries

      - name: Run UI tests
        run: npx playwright test

      # Upload the report even when tests fail, which is when you need it most
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Traces, screenshots and videos for failed tests
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14